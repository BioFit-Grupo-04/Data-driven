---
Description: Criação de VPC + Subrede + Servidor

Parameters:
  Environmentname:
    Description: Prefixo no nome dos recursos
    Type: String
    Default: Biofit

  Ami:
    Description: id do sistema operacional, Ubuntu 24.04 LTS
    Type: String
    Default: ami-0f8a61b66d1accaee # SEMPRE CHECAR A AMI

  KeyPairName: 
    Description: pem key Name
    Type: AWS::EC2::KeyPair::KeyName
    Default: private_key # CRIAR ESSA CHAVE!!

Resources:
# CRIANDO A REDE
  vpcAzure:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/23
      EnableDnsSupport: 'true'
      EnableDnsHostnames: 'true'
      Tags:
        - Key: Name 
          Value:
            Fn::Sub: "biofit${Environmentname}-vpc"
        - Key: stack
          Value: production

  igw:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: 
            Fn::Sub: "biofit${Environmentname}-igw"

  igwattach:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: 
        Ref: igw
      VpcId: 
        Ref: vpcAzure

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: 
        Ref: vpcAzure
      AvailabilityZone: 
        Fn::Select: 
          - 0
          - Fn::GetAZs: 
              Ref: "AWS::Region"
      CidrBlock: "10.0.0.0/27"
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: 
            Fn::Sub: "biofit${Environmentname}-publicSubnet"

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: 
        Ref: vpcAzure
      Tags:
        - Key: Name
          Value: 
            Fn::Sub: "biofit${Environmentname}-publicRt"

  DefaultPublicRoute:
    Type: AWS::EC2::Route
    DependsOn: igwattach
    Properties:
      RouteTableId: 
        Ref: PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: 
        Ref: igw

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: 
        Ref: PublicRouteTable
      SubnetId: 
        Ref: PublicSubnet

  WebSecurityGroup:
    DependsOn: vpcAzure
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "Permitir HTTP e SSH"
      VpcId: 
        Ref: vpcAzure
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: 
            Fn::Sub: "biofit-${Environmentname}-sg"

# CRIANDO O EC2
  Broker:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.medium
      ImageId:
        Ref: Ami
      IamInstanceProfile: LabInstanceProfile
      KeyName:
        Ref: KeyPairName
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 60
            VolumeType: gp3
            DeleteOnTermination: true
      UserData:
        Fn::Base64:
          Fn::Sub: |
            #!/bin/bash
            sudo apt update -y
            sudo apt install -y mosquitto mosquitto-clients
            sudo systemctl start mosquitto.service
            sudo systemctl enable mosquitto.service
            cat <<EOF | sudo tee /etc/mosquitto/conf.d/default.conf
            listener 1883 0.0.0.0
            allow_anonymous true
            EOF
            sudo systemctl restart mosquitto.service

      NetworkInterfaces:
        - DeviceIndex: "0"
          AssociatePublicIpAddress: true     # <- pede o IP público
          SubnetId: 
            Ref: PublicSubnet
          PrivateIpAddress: 10.0.0.4
          GroupSet:
            - Ref: WebSecurityGroup
      Tags:
        - Key: Name
          Value: 
            Fn::Sub: "biofit-${Environmentname}-broker"

# CRIANDO O EC2 2
  tig:
    Type: AWS::EC2::Instance
    DependsOn: Broker
    Properties:
      InstanceType: t3.medium
      ImageId:
        Ref: Ami
      IamInstanceProfile: LabInstanceProfile
      KeyName:
        Ref: KeyPairName
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 60
            VolumeType: gp3
            DeleteOnTermination: true
      UserData:
        Fn::Base64:
          Fn::Sub: |
            #!/bin/bash
            export DEBIAN_FRONTEND=noninteractive
            apt update -y
            apt install -y docker.io docker-compose-v2
            systemctl enable --now docker

            mkdir -p /home/ubuntu/docker/nginx /home/ubuntu/docker/telegraf
            cd /home/ubuntu/docker

            cat <<'EOF' > docker-compose.yml
            services:
              influxdb:
                image: influxdb:2.7
                container_name: iot-influxdb
                environment:
                  - DOCKER_INFLUXDB_INIT_MODE=setup
                  - DOCKER_INFLUXDB_INIT_USERNAME=admin
                  - DOCKER_INFLUXDB_INIT_PASSWORD=urubu100
                  - DOCKER_INFLUXDB_INIT_ORG=faculdade
                  - DOCKER_INFLUXDB_INIT_BUCKET=sensores
                  - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=TokenSecretoEstaticoParaOTelegraf2026LabIoT
                volumes:
                  - influxdb_data:/var/lib/influxdb2
                networks:
                  - iot-network
                restart: unless-stopped

              telegraf:
                image: telegraf:1.30
                container_name: iot-telegraf
                volumes:
                  - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
                depends_on:
                  - influxdb
                networks:
                  - iot-network
                restart: unless-stopped

              grafana:
                image: grafana/grafana-oss:latest
                container_name: iot-grafana
                environment:
                  - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s/grafana/
                  - GF_SERVER_SERVE_FROM_SUB_PATH=true
                volumes:
                  - grafana_data:/var/lib/grafana
                depends_on:
                  - influxdb
                networks:
                  - iot-network
                restart: unless-stopped

              nginx:
                image: nginx:alpine
                container_name: iot-nginx
                ports:
                  - "80:80"
                volumes:
                  - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
                depends_on:
                  - telegraf
                  - influxdb
                  - grafana
                networks:
                  - iot-network
                restart: unless-stopped

            networks:
              iot-network:
                driver: bridge

            volumes:
              influxdb_data:
              grafana_data:
            EOF

            cat <<'EOF' > telegraf/telegraf.conf
            [agent]
            interval = "5s"
            round_interval = true
            metric_batch_size = 1000
            metric_buffer_limit = 10000
            collection_jitter = "0s"
            flush_interval = "5s"
            flush_jitter = "0s"
            precision = "0s"
            hostname = "iot-server"
            omit_hostname = true

            [[inputs.mqtt_consumer]]
            servers = ["tcp://10.0.0.4:1883"]
            topics = ["sensores/#"]
            data_format = "json_v2"

            [[inputs.mqtt_consumer.json_v2]]
                measurement_name = "telemetria_iot"
                timestamp_path = "timestamp"
                timestamp_format = "unix"

                [[inputs.mqtt_consumer.json_v2.tag]]
                path = "dispositivo.id"
                rename = "dispositivo_id"
                type = "string"

                [[inputs.mqtt_consumer.json_v2.tag]]
                path = "dispositivo.status"
                rename = "status"
                type = "string"

                [[inputs.mqtt_consumer.json_v2.tag]]
                path = "localizacao.bloco"
                rename = "bloco"
                type = "string"

                [[inputs.mqtt_consumer.json_v2.tag]]
                path = "localizacao.sala"
                rename = "sala"
                type = "string"

                [[inputs.mqtt_consumer.json_v2.field]]
                path = "leitura.temperatura"
                rename = "temperatura"
                type = "float"

                [[inputs.mqtt_consumer.json_v2.field]]
                path = "leitura.umidade"
                rename = "umidade"
                type = "float"

                [[inputs.mqtt_consumer.json_v2.field]]
                path = "leitura.mensagem_id"
                rename = "mensagem_id"
                type = "int"

            [[outputs.influxdb_v2]]
            urls = ["http://influxdb:8086"]
            token = "TokenSecretoEstaticoParaOTelegraf2026LabIoT"
            organization = "faculdade"
            bucket = "sensores"
            EOF

            cat <<'EOF' > nginx/default.conf
            server {
                listen 80;
                server_name _;

                location / {
                    proxy_pass http://influxdb:8086/;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_connect_timeout 90s;
                    proxy_read_timeout 90s;
                }

                location /grafana/ {
                    proxy_pass http://grafana:3000;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }
            }
            EOF

            chown -R ubuntu:ubuntu /home/ubuntu/docker
            docker compose up -d
            
      NetworkInterfaces:
        - DeviceIndex: "0"
          AssociatePublicIpAddress: true     # <- pede o IP público
          SubnetId: 
            Ref: PublicSubnet
          PrivateIpAddress: 10.0.0.5
          GroupSet:
            - Ref: WebSecurityGroup
      Tags:
        - Key: Name
          Value: 
            Fn::Sub: "biofit-${Environmentname}-tig"

# CRIANDO O EC2 3
  nodered:
    Type: AWS::EC2::Instance
    DependsOn: Broker
    Properties:
      InstanceType: t3.medium
      ImageId:
        Ref: Ami
      IamInstanceProfile: LabInstanceProfile
      KeyName:
        Ref: KeyPairName
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 60
            VolumeType: gp3
            DeleteOnTermination: true
      UserData:
        Fn::Base64:
          Fn::Sub: |
            #!/bin/bash
            export DEBIAN_FRONTEND=noninteractive
            apt update
            apt install -y docker.io docker-compose-v2
            systemctl enable --now docker
            cd /home/ubuntu

            mkdir -p node-red-proxy
            cd node-red-proxy
            mkdir -p nginx

            cat <<'EOF' > docker-compose.yml
            services:
              node-red:
                image: nodered/node-red:latest
                restart: unless-stopped
                environment:
                  - TZ=America/Sao_Paulo
                volumes:
                  - node_red_data:/data
                networks:
                  - app_net
                expose:
                  - "1880"

              nginx:
                image: nginx:stable-alpine
                restart: unless-stopped
                depends_on:
                  - node-red
                ports:
                  - "80:80"
                volumes:
                  - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
                networks:
                  - app_net

            volumes:
              node_red_data:

            networks:
              app_net:
                driver: bridge
            EOF

            cd nginx

            cat <<'EOF' > default.conf
            server {
                listen 80;
                server_name _;

                client_max_body_size 10m;

                location / {
                    proxy_pass http://node-red:1880;
                    proxy_http_version 1.1;

                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;

                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection "upgrade";

                    proxy_read_timeout 86400;
                    proxy_send_timeout 86400;
                }
            }
            EOF

            chown -R ubuntu:ubuntu /home/ubuntu/node-red-proxy
            cd /home/ubuntu/node-red-proxy
            docker compose up -d
      NetworkInterfaces:
        - DeviceIndex: "0"
          AssociatePublicIpAddress: true     # <- pede o IP público
          SubnetId: 
            Ref: PublicSubnet
          PrivateIpAddress: 10.0.0.6
          GroupSet:
            - Ref: WebSecurityGroup
      Tags:
        - Key: Name
          Value: 
            Fn::Sub: "biofit-${Environmentname}-nodered"
...